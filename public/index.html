<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CYBER LANDLORD - AI 决策逻辑完美修复版</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --cyber-pink: #ff007f;
      --cyber-cyan: #00f0ff;
      --cyber-yellow: #facc15;
      --cyber-purple: #7000ff;
      --bg-dark: #05070f;
      --panel-bg: rgba(10, 15, 29, 0.92);
      --border-cyber: rgba(0, 240, 255, 0.3);
      --shadow-cyber: 0 0 25px rgba(0, 240, 255, 0.2);
    }

    * {
      box-sizing: border-box; margin: 0; padding: 0; user-select: none;
      -webkit-user-select: none; -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Courier New', Consolas, "PingFang SC", sans-serif;
    }
    
    html, body {
      width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark);
      display: flex; justify-content: center; align-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    #game-container {
      position: relative; width: 100vw; height: 100vh;
      max-width: 1366px; max-height: 1024px;
      background: radial-gradient(circle at 50% 30%, #0d1527 0%, #03050a 100%);
      border: 1px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 0 80px rgba(0, 240, 255, 0.15); overflow: hidden;
      display: flex; z-index: 1;
    }

    #gameCanvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; touch-action: none;
    }

    .sidebar {
      width: 220px; height: 100%;
      background: rgba(8, 12, 23, 0.95); backdrop-filter: blur(16px);
      border-right: 1px solid var(--border-cyber);
      z-index: 50; display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px 12px; pointer-events: auto; transition: all 0.3s ease;
    }

    @media (max-width: 768px) {
      .sidebar { width: 170px; padding: 12px 8px; }
      .sidebar-brand h2 { font-size: 1rem !important; }
      .nav-item { font-size: 11px !important; padding: 10px 8px !important; }
    }

    .sidebar-brand h2 {
      font-size: 1.2rem;
      background: linear-gradient(135deg, var(--cyber-cyan) 0%, var(--cyber-pink) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      font-weight: 900; letter-spacing: 1px; text-align: center;
    }

    .sidebar-menu { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-radius: 8px;
      color: #8a99ad; font-size: 13px; font-weight: bold;
      cursor: pointer; transition: all 0.2s; border: 1px solid transparent;
    }
    .nav-item:hover { background: rgba(0, 240, 255, 0.08); color: #fff; border-color: rgba(0, 240, 255, 0.2); }
    .nav-item.active {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.15) 0%, rgba(255, 0, 127, 0.1) 100%);
      border-color: var(--cyber-cyan); color: var(--cyber-cyan);
    }

    .sidebar-user {
      background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px; padding: 10px; display: flex; align-items: center; gap: 8px;
    }

    .main-viewport { flex: 1; height: 100%; position: relative; pointer-events: none; z-index: 10; }
    .hidden { display: none !important; }

    .view-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: var(--panel-bg); backdrop-filter: blur(16px);
      border: 1px solid var(--cyber-cyan); border-radius: 16px;
      padding: 24px; width: 92%; max-width: 440px; text-align: center;
      box-shadow: var(--shadow-cyber); pointer-events: auto; z-index: 20;
    }

    .panel-title { font-size: 18px; color: var(--cyber-cyan); margin-bottom: 16px; font-weight: 900; letter-spacing: 1px; }

    .input-field, select.input-field {
      width: 100%; padding: 12px 14px; border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.3); background: rgba(5, 7, 15, 0.8);
      color: #fff; font-size: 14px; margin-bottom: 12px; outline: none;
    }

    .btn {
      padding: 12px 20px; border-radius: 8px; border: none; font-size: 13px; font-weight: 900;
      cursor: pointer; outline: none; transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); pointer-events: auto;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.2); }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; filter: grayscale(1); }

    .btn-cyber { background: linear-gradient(135deg, var(--cyber-cyan) 0%, #0072ff 100%); color: #000; }
    .btn-pink { background: linear-gradient(135deg, var(--cyber-pink) 0%, var(--cyber-purple) 100%); color: #fff; }
    .btn-gold { background: linear-gradient(135deg, var(--cyber-yellow) 0%, #d97706 100%); color: #000; }
    .btn-dark { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.15); }

    .action-bar {
      position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 20; pointer-events: auto; width: 90%; max-width: 400px; justify-content: center;
    }
    .action-bar .btn { flex: 1; padding: 10px 12px; font-size: 12px; }

    .turn-tip {
      position: absolute; bottom: 22%; left: 50%; transform: translateX(-50%);
      background: rgba(5, 7, 15, 0.9); border: 1px solid var(--cyber-cyan);
      padding: 6px 18px; border-radius: 20px; color: var(--cyber-cyan);
      font-weight: bold; font-size: 12px; pointer-events: none; box-shadow: var(--shadow-cyber);
      white-space: nowrap;
    }

    .auth-tabs { display: flex; margin-bottom: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .auth-tab { flex: 1; padding: 10px; color: #8a99ad; font-weight: bold; cursor: pointer; }
    .auth-tab.active { color: var(--cyber-cyan); border-bottom: 2px solid var(--cyber-cyan); }

    .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 240px; overflow-y: auto; margin-bottom: 16px; }
    .shop-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(0, 240, 255, 0.15); border-radius: 12px; padding: 10px; text-align: center; }

    .toast-container {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      z-index: 999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; width: 90%; max-width: 360px; text-align: center;
    }
    .toast-msg {
      background: rgba(10, 15, 29, 0.95); border: 1px solid var(--cyber-cyan);
      color: #fff; padding: 8px 18px; border-radius: 30px; font-size: 12px; font-weight: bold;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="toast-container" id="toast-container"></div>

    <div class="sidebar hidden" id="main-sidebar">
      <div>
        <div class="sidebar-brand">
          <h2>CYBER LANDLORD</h2>
          <p style="color: #64748b; font-size: 8px; margin-top: 2px; letter-spacing: 1px;">PERFECT AI ENGINE V14.0</p>
        </div>

        <div class="sidebar-menu">
          <div class="nav-item active" id="nav-lobby" onclick="gameApp.switchView('lobby')">
            <span>🎮</span> 赛博大厅
          </div>
          <div class="nav-item" id="nav-shop" onclick="gameApp.switchView('shop')">
            <span>🛒</span> 道具商城
          </div>
          <div class="nav-item" id="nav-2fa" onclick="gameApp.switchView('2fa')">
            <span>🔐</span> 2FA 验证
          </div>
        </div>
      </div>

      <div class="sidebar-user">
        <div style="font-size:20px;" id="sidebar-avatar">🤖</div>
        <div>
          <div style="color:#fff; font-size:12px; font-weight:bold;" id="sidebar-username">玩家</div>
          <div style="color:var(--cyber-yellow); font-size:11px;">🪙 <span id="sidebar-coins">0</span></div>
        </div>
      </div>
    </div>

    <div class="main-viewport">
      <div class="turn-tip hidden" id="turn-tip">SYSTEM: WAITING...</div>

      <div class="action-bar hidden" id="action-bar">
        <button class="btn btn-dark" id="btn-pass" onclick="gameApp.passTurn()">PASS / 不出</button>
        <button class="btn btn-cyber" onclick="gameApp.sortHand()">理牌</button>
        <button class="btn btn-pink" id="btn-play" onclick="gameApp.playCards()">确认出牌</button>
      </div>

      <div class="view-panel" id="panel-auth">
        <div class="panel-title">CYBER AUTHENTICATION</div>
        <div class="auth-tabs">
          <div class="auth-tab active" id="tab-login" onclick="gameApp.switchAuthTab('login')">登录</div>
          <div class="auth-tab" id="tab-register" onclick="gameApp.switchAuthTab('register')">注册</div>
        </div>

        <input type="text" id="auth-username" class="input-field" placeholder="玩家账号" value="JR玩家" />
        <input type="password" id="auth-password" class="input-field" placeholder="密码" value="123456" />
        <input type="text" id="auth-2fa-input" class="input-field hidden" placeholder="输入 6 位 2FA 动态验证码" maxlength="6" />

        <button class="btn btn-cyber" id="auth-submit-btn" style="width: 100%; margin-top: 6px;" onclick="gameApp.handleAuth()">访问节点</button>
      </div>

      <div class="view-panel hidden" id="panel-lobby">
        <div class="panel-title">🎮 对局模式选择</div>
        
        <label style="color:#8a99ad; font-size:11px; display:block; text-align:left; margin-bottom:4px;">选择模式类型：</label>
        <select id="room-mode-select" class="input-field">
          <option value="2">二人联机 PK 模式 (1副牌)</option>
          <option value="3">三人联机经典斗地主 (1副牌)</option>
          <option value="5">五人联机双副牌模式 (2副牌)</option>
          <option value="AI">🤖 离线单人对战 AI (随时开局)</option>
        </select>

        <input type="text" id="room-input" class="input-field" placeholder="输入/创建房间号 (例如: 888)" value="888" />
        
        <div style="display: flex; gap: 10px; margin-top: 6px;">
          <button class="btn btn-cyber" style="flex: 1;" onclick="gameApp.createRoom()">构建房间</button>
          <button class="btn btn-pink" style="flex: 1;" onclick="gameApp.joinRoom()">加入房间</button>
        </div>
      </div>

      <div class="view-panel hidden" id="panel-shop">
        <div class="panel-title">🛒 赛博装备商城</div>
        <div class="shop-grid" id="shop-grid"></div>
        <button class="btn btn-dark" style="width: 100%;" onclick="gameApp.switchView('lobby')">返回大厅</button>
      </div>

      <div class="view-panel hidden" id="panel-2fa">
        <div class="panel-title">🔐 2FA 安全验证绑定</div>
        <p style="color:#8a99ad; font-size:11px; margin-bottom:10px;">使用 Authenticator App 扫描二维码：</p>
        
        <div id="2fa-setup-box">
          <button class="btn btn-gold" onclick="gameApp.generate2FA()">生成 2FA 密钥</button>
        </div>

        <div id="2fa-qr-box" class="hidden">
          <div style="background:#fff; padding:6px; border-radius:8px; display:inline-block; margin-bottom:10px;">
            <img id="2fa-qr-img" src="" style="width:120px; height:120px; display:block;" />
          </div>
          <input type="text" id="verify-2fa-input" class="input-field" placeholder="输入 6 位验证码" maxlength="6" />
          <button class="btn btn-cyber" style="width:100%" onclick="gameApp.verify2FA()">激活 2FA 绑定</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let socket = null;
    const CARD_SUITS = { SPADE: '♠', HEART: '♥', CLUB: '♣', DIAMOND: '♦' };
    const RANK_VALUES = {
      '3': 3, '4': 4, '5': 5, '6': 6, '7': 7, '8': 8, '9': 9, '10': 10,
      'J': 11, 'Q': 12, 'K': 13, 'A': 14, '2': 15, '小王': 16, '大王': 17
    };

    function normalizeCard(rawCard) {
      if (!rawCard) return { rank: '?', suit: '', value: 0 };
      const rank = rawCard.rank || (rawCard.value === 16 ? '小王' : rawCard.value === 17 ? '大王' : '?');
      const suit = rawCard.suit || '';
      const value = rawCard.value || RANK_VALUES[rank] || 0;
      return { rank, suit, value };
    }

    class CardRulesEngine {
      static parseCards(cards) {
        if (!cards || cards.length === 0) return null;
        const sorted = [...cards].map(normalizeCard).sort((a, b) => a.value - b.value);
        const len = sorted.length;
        const values = sorted.map(c => c.value);
        
        const freq = {};
        values.forEach(v => freq[v] = (freq[v] || 0) + 1);
        const keys = Object.keys(freq).map(Number).sort((a, b) => a - b);
        const counts = Object.values(freq);

        if (len === 2 && values[0] === 16 && values[1] === 17) return { type: 'KING_BOMB', value: 17, length: 2, name: '王炸' };
        if (len === 1) return { type: 'SINGLE', value: values[0], length: 1, name: '单张' };
        if (len === 2 && values[0] === values[1]) return { type: 'PAIR', value: values[0], length: 2, name: '对子' };
        if (len === 3 && counts.length === 1) return { type: 'TRIPLE', value: values[0], length: 3, name: '三张' };
        if (len === 4 && counts.includes(3) && counts.includes(1)) return { type: 'TRIPLE_ONE', value: keys.find(k => freq[k] === 3), length: 4, name: '三带一' };
        if (len === 5 && counts.includes(3) && counts.includes(2)) return { type: 'TRIPLE_PAIR', value: keys.find(k => freq[k] === 3), length: 5, name: '三带二' };
        if (len === 4 && counts.length === 1) return { type: 'BOMB', value: values[0], length: 4, name: '炸弹' };
        if (len >= 5 && counts.every(c => c === 1) && values[len - 1] < 15 && (values[len - 1] - values[0] === len - 1)) {
          return { type: 'STRAIGHT', value: values[len - 1], length: len, name: '顺子' };
        }
        if (len >= 6 && len % 2 === 0 && counts.every(c => c === 2) && values[len - 1] < 15) {
          if (keys[keys.length - 1] - keys[0] === keys.length - 1) {
            return { type: 'STRAIGHT_PAIR', value: keys[keys.length - 1], length: len, name: '连对' };
          }
        }
        return null;
      }

      static canBeat(myHand, lastHand) {
        if (!lastHand) return true;

        if (myHand.type === 'KING_BOMB') return true;
        if (lastHand.type === 'KING_BOMB') return false;
        if (myHand.type === 'BOMB' && lastHand.type !== 'BOMB') return true;
        if (lastHand.type === 'BOMB' && myHand.type !== 'BOMB') return false;

        if (myHand.type === lastHand.type && myHand.length === lastHand.length) {
          return myHand.value > lastHand.value;
        }

        return false;
      }
    }

    class LandlordGameApp {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.authMode = 'login';
        this.isAIMode = false;
        this.user = null;
        this.myHand = [];
        this.aiHands = [[], []];
        this.selectedIndices = new Set();
        
        this.tablePlayedHand = null; 
        this.lastPlayedHand = null;
        this.isMyTurn = false;

        this.initCanvasSize();
        this.bindEvents();
        requestAnimationFrame(() => this.renderLoop());
      }

      showToast(text) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast-msg';
        toast.innerText = text;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }

      initCanvasSize() {
        const container = document.getElementById('game-container');
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = container.clientWidth * dpr;
        this.canvas.height = container.clientHeight * dpr;
        this.ctx.scale(dpr, dpr);
        this.width = container.clientWidth;
        this.height = container.clientHeight;
      }

      bindEvents() {
        window.addEventListener('resize', () => this.initCanvasSize());
        
        const handleTouchOrClick = (e) => {
          const rect = this.canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;

          const clickX = clientX - rect.left;
          const clickY = clientY - rect.top;

          const isMobile = this.width < 600;
          const cardW = isMobile ? Math.min(48, (this.width - 20) / (this.myHand.length || 1)) : Math.min(65, (this.width - 40) / (this.myHand.length || 1));
          const cardH = isMobile ? 72 : 92;
          const overlap = Math.min(isMobile ? 22 : 28, (this.width - 60) / (this.myHand.length || 1));
          const startX = (this.width - (cardW + (this.myHand.length - 1) * overlap)) / 2;
          const startY = this.height - cardH - (isMobile ? 12 : 20);

          for (let i = this.myHand.length - 1; i >= 0; i--) {
            const x = startX + i * overlap;
            const hitW = (i === this.myHand.length - 1) ? cardW : overlap;
            if (clickX >= x && clickX <= x + hitW && clickY >= startY - 25 && clickY <= startY + cardH) {
              this.selectedIndices.has(i) ? this.selectedIndices.delete(i) : this.selectedIndices.add(i);
              break;
            }
          }
        };

        this.canvas.addEventListener('touchstart', (e) => { handleTouchOrClick(e); e.preventDefault(); }, { passive: false });
        this.canvas.addEventListener('click', handleTouchOrClick);
      }

      switchView(viewName) {
        ['panel-lobby', 'panel-shop', 'panel-2fa'].forEach(id => document.getElementById(id).classList.add('hidden'));
        ['nav-lobby', 'nav-shop', 'nav-2fa'].forEach(id => document.getElementById(id).classList.remove('active'));

        document.getElementById(`panel-${viewName}`).classList.remove('hidden');
        document.getElementById(`nav-${viewName}`).classList.add('active');

        if (viewName === 'shop') this.loadShopItems();
      }

      switchAuthTab(tab) {
        this.authMode = tab;
        document.getElementById('tab-login').className = `auth-tab ${tab === 'login' ? 'active' : ''}`;
        document.getElementById('tab-register').className = `auth-tab ${tab === 'register' ? 'active' : ''}`;
      }

      async handleAuth() {
        const username = document.getElementById('auth-username').value.trim();
        const password = document.getElementById('auth-password').value.trim();
        const twoFAToken = document.getElementById('auth-2fa-input').value.trim();

        if (!username || !password) return this.showToast('⚠️ 请输入账号和密码！');

        const endpoint = this.authMode === 'login' ? '/api/auth/login' : '/api/auth/register';
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, twoFAToken })
        });
        const data = await res.json();

        if (data.require2FA) {
          document.getElementById('auth-2fa-input').classList.remove('hidden');
          this.showToast(data.message);
          return;
        }

        if (data.success) {
          if (this.authMode === 'register') {
            this.showToast('✅ 注册成功！请登录');
            this.switchAuthTab('login');
          } else {
            this.user = data.user;
            this.updateUserUI();
            document.getElementById('panel-auth').classList.add('hidden');
            document.getElementById('main-sidebar'
