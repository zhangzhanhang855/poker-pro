<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Client Layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f1419;
            color: #e7e9ea;
            height: 100vh;
            overflow: hidden;
        }

        /* 界面切换容器 */
        .page {
            display: none;
            height: 100vh;
            width: 100vw;
        }

        .page.active {
            display: flex;
        }

        /* ------------------ 1. 登录界面 ------------------ */
        #loginPage {
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e1e2f, #0f1419);
        }

        .login-card {
            background-color: #16181c;
            padding: 32px;
            border-radius: 16px;
            border: 1px solid #2f3336;
            width: 90%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        .login-card input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333639;
            background-color: #0f1419;
            color: #fff;
            outline: none;
        }

        .login-card button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #1d9bf0;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        /* ------------------ 2. 主大厅界面框架 ------------------ */
        #mainApp {
            flex-direction: column; /* 默认手机端：上下布局 */
        }

        /* 内容展示区 */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background-color: #0f1419;
        }

        .section-view {
            display: none;
        }

        .section-view.active {
            display: block;
        }

        /* ------------------ 导航栏响应式布局 ------------------ */
        .nav-bar {
            background-color: #16181c;
            border-color: #2f3336;
            display: flex;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #71767b;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .nav-item.active {
            color: #1d9bf0;
            font-weight: bold;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* 📱 手机端 (默认: < 768px) */
        @media (max-width: 767px) {
            #mainApp {
                flex-direction: column;
            }

            .nav-bar {
                height: 64px;
                border-top: 1px solid #2f3336;
                flex-direction: row;
                justify-content: space-around;
                align-items: center;
                order: 2; /* 导航置底 */
            }

            .content-area {
                order: 1;
            }

            .nav-item {
                flex-direction: column;
                font-size: 11px;
            }
        }

        /* 📱 iPad / 平板 / 桌面端 (≥ 768px) */
        @media (min-width: 768px) {
            #mainApp {
                flex-direction: row; /* 横向布局：左侧导航 + 右侧内容 */
            }

            .nav-bar {
                width: 220px;
                height: 100vh;
                border-right: 1px solid #2f3336;
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 40px;
                gap: 12px;
            }

            .nav-item {
                flex-direction: row;
                justify-content: flex-start;
                padding: 14px 24px;
                width: 100%;
                font-size: 16px;
                border-left: 4px solid transparent;
            }

            .nav-item.active {
                background-color: rgba(29, 155, 240, 0.1);
                border-left-color: #1d9bf0;
            }
        }

        /* 卡片通用样式 */
        .card {
            background-color: #16181c;
            border: 1px solid #2f3336;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <!-- 1. 登录界面 -->
    <div id="loginPage" class="page active">
        <div class="login-card">
            <h2>游戏登录</h2>
            <input type="text" id="username" placeholder="请输入用户名" value="Player_01">
            <button onclick="handleLogin()">进入游戏</button>
        </div>
    </div>

    <!-- 2. 主菜单界面 (登录后进入) -->
    <div id="mainApp" class="page">
        <!-- 导航栏 (手机端在底，iPad端在左) -->
        <nav class="nav-bar">
            <div class="nav-item" onclick="switchTab('account')">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>账户设置</span>
            </div>
            <div class="nav-item active" onclick="switchTab('game')">
                <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                <span>开始游戏</span>
            </div>
            <div class="nav-item" onclick="switchTab('shop')">
                <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span>商城</span>
            </div>
        </nav>

        <!-- 主内容区域 -->
        <main class="content-area">
            <!-- 账户设置视图 -->
            <section id="view-account" class="section-view">
                <h2>账户设置</h2>
                <div class="card">
                    <p>玩家 ID: <strong id="displayUser">Player_01</strong></p>
                    <p style="margin-top: 8px; color: #71767b;">音效 / 画质 / 账号安全设置面板</p>
                </div>
            </section>

            <!-- 开始游戏视图 (默认展示) -->
            <section id="view-game" class="section-view active">
                <h2>开始游戏</h2>
                <div class="card">
                    <h3>房间匹配</h3>
                    <p style="margin-top: 8px; color: #71767b;">选择你的对战模式并进入房间：</p>
                    <button style="margin-top: 16px; padding: 12px 24px; background: #1d9bf0; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer;">匹配大厅</button>
                </div>
            </section>

            <!-- 商城视图 -->
            <section id="view-shop" class="section-view">
                <h2>游戏商城</h2>
                <div class="card">
                    <p>🛒 皮肤 / 道具 / 月卡 选购区</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        // 模拟登录，进入主大厅界面
        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            if (!user) return alert('请输入用户名');

            document.getElementById('displayUser').textContent = user;
            
            // 切换视图：隐藏登录页，展示主界面
            document.getElementById('loginPage').classList.remove('active');
            document.getElementById('mainApp').classList.add('active');
            
            // 默认选中“开始游戏”选项卡
            switchTab('game');
        }

        // 切换 账户设置 / 开始游戏 / 商城 Tab
        function switchTab(tabName) {
            // 1. 更新导航栏高亮状态
            const navItems = document.querySelectorAll('.nav-item');
            const targetIndex = { 'account': 0, 'game': 1, 'shop': 2 }[tabName];
            
            navItems.forEach((item, index) => {
                if (index === targetIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            // 2. 切换对应 View 的显示
            const views = document.querySelectorAll('.section-view');
            views.forEach(view => view.classList.remove('active'));
            document.getElementById(`view-${tabName}`).classList.add('active');
        }
    </script>
</body>
</html>
