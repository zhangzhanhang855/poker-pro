<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UNO Arena - HTML5 Canvas Full-Stack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    
    /* DOM Overlays for color picker modal */
    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); display: none;
      align-items: center; justify-content: center; z-index: 100;
    }
    .modal-box {
      background: #1e293b; border: 2px solid #38bdf8; border-radius: 16px;
      padding: 24px; text-align: center; color: white; width: 320px;
    }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .color-btn {
      height: 60px; border-radius: 12px; border: none; font-weight: bold;
      font-size: 18px; color: white; cursor: pointer; transition: transform 0.1s;
    }
    .color-btn:hover { transform: scale(1.05); }
    .bg-Red { background: #ef4444; } .bg-Yellow { background: #eab308; color: #000; }
    .bg-Green { background: #22c55e; } .bg-Blue { background: #3b82f6; }

    /* Action overlay buttons */
    .btn-action {
      padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold;
      font-size: 16px; cursor: pointer; color: white; transition: background 0.2s;
    }
    .btn-accept { background: #22c55e; } .btn-accept:hover { background: #16a34a; }
    .btn-challenge { background: #ef4444; } .btn-challenge:hover { background: #dc2626; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div id="canvas-container">
  <canvas id="gameCanvas"></canvas>

  <!-- Color Selection Modal -->
  <div id="colorModal" class="modal-overlay">
    <div class="modal-box">
      <h3>Select Active Wild Color</h3>
      <div class="modal-grid">
        <button class="color-btn bg-Red" onclick="selectWildColor('Red')">Red</button>
        <button class="color-btn bg-Yellow" onclick="selectWildColor('Yellow')">Yellow</button>
        <button class="color-btn bg-Green" onclick="selectWildColor('Green')">Green</button>
        <button class="color-btn bg-Blue" onclick="selectWildColor('Blue')">Blue</button>
      </div>
    </div>
  </div>

  <!-- Challenge Modal -->
  <div id="challengeModal" class="modal-overlay">
    <div class="modal-box">
      <h3 id="challengeTitle">Wild +4 Played!</h3>
      <p style="margin: 12px 0; font-size: 14px; color: #cbd5e1;">Do you want to challenge if they had a matching color in hand?</p>
      <div style="display:flex; gap: 12px; justify-content: center;">
        <button class="btn-action btn-accept" onclick="respondChallenge(false)">Accept (+4)</button>
        <button class="btn-action btn-challenge" onclick="respondChallenge(true)">Challenge!</button>
      </div>
    </div>
  </div>
</div>

<script>
const socket = io();
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let myId = null;
let gameState = null;
let pendingWildCardId = null;

// Card Layout Rectangles for click detection
let cardRects = [];
let drawPileRect = null;
let unoButtonRect = null;
let startButtonRect = null;

const COLOR_MAP = {
  'Red': '#ef4444',
  'Yellow': '#eab308',
  'Green': '#22c55e',
  'Blue': '#3b82f6',
  'Wild': '#8b5cf6'
};

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  render();
}
window.addEventListener('resize', resizeCanvas);

socket.on('joined', (data) => {
  myId = data.id;
  const playerName = prompt("Enter your Player Name:", "Player " + Math.floor(Math.random() * 900 + 100));
  socket.emit('joinGame', playerName || "Anonymous");
});

socket.on('gameState', (state) => {
  gameState = state;
  checkModals();
  render();
});

function checkModals() {
  if (!gameState) return;
  // Handle Challenge modal display
  const challengeModal = document.getElementById('challengeModal');
  if (gameState.pendingChallenge && gameState.pendingChallenge.victimId === myId) {
    document.getElementById('challengeTitle').innerText = `${gameState.pendingChallenge.blufferName} played Wild +4!`;
    challengeModal.style.display = 'flex';
  } else {
    challengeModal.style.display = 'none';
  }
}

function selectWildColor(color) {
  document.getElementById('colorModal').style.display = 'none';
  if (pendingWildCardId !== null) {
    socket.emit('playCard', { cardId: pendingWildCardId, chosenColor: color });
    pendingWildCardId = null;
  }
}

function respondChallenge(doChallenge) {
  document.getElementById('challengeModal').style.display = 'none';
  socket.emit('resolveChallenge', doChallenge);
}

// ==========================================
// CANVAS RENDER ENGINE
// ==========================================
function render() {
  const W = canvas.width;
  const H = canvas.height;

  // Background gradient
  const bgGradient = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, Math.max(W, H));
  bgGradient.addColorStop(0, '#1e293b');
  bgGradient.addColorStop(1, '#0f172a');
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, W, H);

  if (!gameState) return;

  cardRects = [];

  // Lobby view if game not started
  if (!gameState.gameStarted) {
    renderLobby(W, H);
    return;
  }

  // Active Game Board
  renderHeader(W, H);
  renderTableCenter(W, H);
  renderOpponents(W, H);
  renderMyHand(W, H);
  renderLogs(W, H);
}

function renderLobby(W, H) {
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 36px 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("UNO ARENA LOBBY", W / 2, H / 2 - 120);

  ctx.font = "20px 'Segoe UI', sans-serif";
  ctx.fillStyle = "#94a3b8";
  ctx.fillText(`Connected Players (${gameState.players.length}/4):`, W / 2, H / 2 - 60);

  gameState.players.forEach((p, idx) => {
    ctx.fillStyle = p.id === myId ? "#38bdf8" : "#ffffff";
    ctx.font = "18px 'Segoe UI', sans-serif";
    ctx.fillText(`${idx + 1}. ${p.name} ${p.id === myId ? '(You)' : ''}`, W / 2, H / 2 - 20 + (idx * 30));
  });

  if (gameState.players.length >= 2) {
    const btnW = 200, btnH = 50;
    const btnX = W / 2 - btnW / 2;
    const btnY = H / 2 + 120;
    startButtonRect = { x: btnX, y: btnY, w: btnW, h: btnH };

    ctx.fillStyle = "#22c55e";
    roundRect(ctx, btnX, btnY, btnW, btnH, 12, true, false);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px 'Segoe UI', sans-serif";
    ctx.fillText("START GAME", W / 2, btnY + 32);
  } else {
    ctx.fillStyle = "#f59e0b";
    ctx.font = "italic 16px 'Segoe UI', sans-serif";
    ctx.fillText("Waiting for at least 2 players to join...", W / 2, H / 2 + 140);
  }
}

function renderHeader(W, H) {
  // Scoreboard / Status bar
  ctx.fillStyle = "#1e293b";
  ctx.fillRect(0, 0, W, 60);
  ctx.strokeStyle = "#334155";
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, W, 60);

  ctx.fillStyle = "#38bdf8";
  ctx.font = "bold 20px 'Segoe UI', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("UNO Arena", 20, 36);

  ctx.fillStyle = "#ffffff";
  ctx.font = "16px 'Segoe UI', sans-serif";
  ctx.textAlign = "right";
  
  const curPlayer = gameState.players[gameState.currentTurnIndex];
  const isMyTurn = curPlayer?.id === myId;
  
  ctx.fillText(`Turn: ${curPlayer ? curPlayer.name : ''} ${isMyTurn ? '(YOUR TURN!)' : ''}`, W - 20, 36);
}

function renderTableCenter(W, H) {
  const cX = W / 2;
  const cY = H / 2 - 30;

  // Render Direction Indicator
  ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(cX, cY, 140, 0, Math.PI * 2);
  ctx.stroke();

  // Active Color indicator aura
  ctx.fillStyle = COLOR_MAP[gameState.currentColor] || '#ffffff';
  ctx.globalAlpha = 0.2;
  ctx.beginPath();
  ctx.arc(cX + 60, cY, 70, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1.0;

  // Draw Pile (Back of Card)
  const cardW = 90, cardH = 135;
  const drawX = cX - 110, drawY = cY - cardH / 2;
  drawPileRect = { x: drawX, y: drawY, w: cardW, h: cardH };

  renderCardBack(drawX, drawY, cardW, cardH, `Draw (${gameState.drawPileCount})`);

  // Discard Pile Top Card
  const discardX = cX + 15, discardY = cY - cardH / 2;
  if (gameState.topDiscard) {
    renderCardFace(discardX, discardY, cardW, cardH, gameState.topDiscard, false);
  }

  // Draw UNO Shout Button
  const unoW = 80, unoH = 80;
  const unoX = cX + 130, unoY = cY - unoH / 2;
  unoButtonRect = { x: unoX, y: unoY, w: unoW, h: unoH };

  ctx.fillStyle = "#ef4444";
  ctx.beginPath();
  ctx.arc(unoX + unoW/2, unoY + unoH/2, unoW/2, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#ffffff";
  ctx.stroke();

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 22px 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("UNO!", unoX + unoW/2, unoY + unoH/2 + 8);
}

function renderOpponents(W, H) {
  const opponents = gameState.players.filter(p => p.id !== myId);
  const total = opponents.length;
  if (total === 0) return;

  const startX = W / (total + 1);
  opponents.forEach((p, i) => {
    const x = startX * (i + 1);
    const y = 90;

    // Active Highlight box
    if (p.isCurrent) {
      ctx.fillStyle = "rgba(56, 189, 248, 0.2)";
      roundRect(ctx, x - 70, y - 10, 140, 95, 8, true, false);
    }

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 16px 'Segoe UI', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(p.name, x, y + 12);

    ctx.font = "14px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#cbd5e1";
    ctx.fillText(`Cards: ${p.cardCount} | Score: ${p.totalScore}`, x, y + 34);

    if (p.calledUno) {
      ctx.fillStyle = "#ef4444";
      ctx.font = "bold 14px 'Segoe UI', sans-serif";
      ctx.fillText("📣 CALLED UNO!", x, y + 56);
    }
  });
}

function renderMyHand(W, H) {
  const hand = gameState.myHand;
  if (!hand) return;

  const cardW = 100, cardH = 150;
  const spacing = Math.min(cardW + 10, (W - 200) / Math.max(hand.length, 1));
  const totalWidth = (hand.length - 1) * spacing + cardW;
  const startX = (W - totalWidth) / 2;
  const startY = H - cardH - 30;

  hand.forEach((card, idx) => {
    const x = startX + idx * spacing;
    const y = startY;
    
    // Check match playability for glow effect
    const curPlayer = gameState.players[gameState.currentTurnIndex];
    const isMyTurn = curPlayer?.id === myId;
    let isPlayable = false;
    
    if (isMyTurn) {
      if (card.color === 'Wild' || card.color === gameState.currentColor || card.value === gameState.activeValue) {
        isPlayable = true;
      }
    }

    cardRects.push({ x, y, w: cardW, h: cardH, card, isPlayable });
    renderCardFace(x, y - (isPlayable ? 15 : 0), cardW, cardH, card, isPlayable);
  });
}

function renderCardFace(x, y, w, h, card, highlight) {
  // Glow outline if playable
  if (highlight) {
    ctx.shadowColor = "#f59e0b";
    ctx.shadowBlur = 12;
  }

  // Outer border & fill
  ctx.fillStyle = COLOR_MAP[card.color] || '#334155';
  roundRect(ctx, x, y, w, h, 10, true, true);
  ctx.shadowBlur = 0; // reset shadow

  // Inner oval frame
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + h/2, w/2.6, h/2.4, Math.PI / 4, 0, Math.PI * 2);
  ctx.fill();

  // Text / Symbol
  ctx.fillStyle = COLOR_MAP[card.color] === '#eab308' ? '#000000' : (card.color === 'Wild' ? '#8b5cf6' : COLOR_MAP[card.color]);
  ctx.font = "bold 26px 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  
  let displayText = card.value;
  if (card.value === 'Draw2') displayText = '+2';
  if (card.value === 'Wild4') displayText = '+4';
  if (card.value === 'Skip') displayText = '🚫';
  if (card.value === 'Reverse') displayText = '🔄';

  ctx.fillText(displayText, x + w/2, y + h/2 + 9);
}

function renderCardBack(x, y, w, h, label) {
  ctx.fillStyle = "#1e293b";
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;
  roundRect(ctx, x, y, w, h, 10, true, true);

  ctx.fillStyle = "#ef4444";
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + h/2, w/2.8, h/2.4, Math.PI / 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 14px 'Segoe UI', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(label, x + w/2, y + h/2 + 5);
}

function renderLogs(W, H) {
  const logX = 20, logY = H - 180;
  ctx.fillStyle = "rgba(15, 23, 42, 0.7)";
  roundRect(ctx, logX, logY, 300, 160, 8, true, false);

  ctx.fillStyle = "#94a3b8";
  ctx.font = "bold 12px 'Segoe UI', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("GAME LOGS", logX + 10, logY + 20);

  ctx.font = "11px 'Segoe UI', sans-serif";
  ctx.fillStyle = "#cbd5e1";
  const logs = gameState.logs || [];
  const displayLogs = logs.slice(-7);
  displayLogs.forEach((l, idx) => {
    ctx.fillText(l, logX + 10, logY + 38 + (idx * 17));
  });
}

function roundRect(ctx, x, y, w, h, radius, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + w - radius, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
  ctx.lineTo(x + w, y + h - radius);
  ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  ctx.lineTo(x + radius, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

// ==========================================
// USER INTERACTION CANVAS EVENTS
// ==========================================
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const clickY = e.clientY - rect.top;

  if (!gameState) return;

  // Lobby start click
  if (!gameState.gameStarted && startButtonRect) {
    if (clickX >= startButtonRect.x && clickX <= startButtonRect.x + startButtonRect.w &&
        clickY >= startButtonRect.y && clickY <= startButtonRect.y + startButtonRect.h) {
      socket.emit('startGame');
      return;
    }
  }

  // Draw card click
  if (drawPileRect && clickX >= drawPileRect.x && clickX <= drawPileRect.x + drawPileRect.w &&
      clickY >= drawPileRect.y && clickY <= drawPileRect.y + drawPileRect.h) {
    socket.emit('drawCard');
    return;
  }

  // Shout UNO click
  if (unoButtonRect) {
    const dist = Math.hypot(clickX - (unoButtonRect.x + unoButtonRect.w/2), clickY - (unoButtonRect.y + unoButtonRect.h/2));
    if (dist <= unoButtonRect.w / 2) {
      socket.emit('callUno');
      return;
    }
  }

  // Card Hand selection click
  for (let i = cardRects.length - 1; i >= 0; i--) {
    const r = cardRects[i];
    if (clickX >= r.x && clickX <= r.x + r.w && clickY >= r.y && clickY <= r.y + r.h) {
      if (r.card.color === 'Wild') {
        pendingWildCardId = r.card.id;
        document.getElementById('colorModal').style.display = 'flex';
      } else {
        socket.emit('playCard', { cardId: r.card.id });
      }
      break;
    }
  }
});
</script>
</body>
</html>
